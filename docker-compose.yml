name: DocEditor

services:

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    # develop:
    #   watch:
    #     - action: rebuild
    #       path: ./nginx/nginx.conf

  frontend:
    build:
      context: ./frontend
    # expose doesn't open the port, it is only for documentation
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        # The container runs the compiled build (node build), so source changes
        # need a rebuild, not a sync.
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    develop:
      watch:
        # "fastapi run" doesn't auto-reload, so restart after syncing
        - action: sync+restart
          path: ./backend/app
          target: /code/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./backend/requirements.txt

  postgres:
    image: postgres:18.6-alpine3.24
    ports:
      - "5432:5432"
    env_file:
      - ./postgres/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ defers expansion to the container's shell, so it uses the env_file values
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: