name: DocEditor

services:

  # Reverse proxy (caddy/Caddyfile). Plain HTTP on localhost:8000 here; docker-compose.prod.yml
  # gives it the domain, ports 80/443 and automatic HTTPS.
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

  # The frontend and backend images are built here, and named for Docker Hub so "make push" can push
  # them. Production pulls them instead of building (docker-compose.prod.yml).
  frontend:
    build:
      context: ./frontend
    image: ${IMAGE_PREFIX:-rishikaley72}/raya-frontend:${TAG:-latest}
    # always build from this checkout; never use an image from Docker Hub in development
    pull_policy: build
    # expose doesn't open the port, it is only for documentation
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        # The container runs the compiled build (node build), so source changes
        # need a rebuild, not a sync.
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/

  backend:
    build:
      context: ./backend
    image: ${IMAGE_PREFIX:-rishikaley72}/raya-backend:${TAG:-latest}
    pull_policy: build
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    develop:
      watch:
        # "fastapi run" doesn't auto-reload, so restart after syncing
        - action: sync+restart
          path: ./backend/app
          target: /code/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./backend/requirements.txt

  postgres:
    image: postgres:18.6-alpine3.24
    # published so a backend running outside Docker (uvicorn) can reach it; not in production
    ports:
      - "5432:5432"
    env_file:
      - ./postgres/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ defers expansion to the container's shell, so it uses the env_file values
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: