[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "python-jose[cryptography]",
    "python-dotenv",
    "couchbase>=4.6.1",
    "asyncpg>=0.31.0",
]

[tool.pytest.ini_options]
# run with: uv run --with pytest pytest   (pytest stays out of .venv, so requirements.txt stays clean)
pythonpath = ["."]
testpaths = ["tests"]
